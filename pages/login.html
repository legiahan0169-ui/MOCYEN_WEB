<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Mộc Yên</title>
  <meta name="description" content="Đăng nhập hoặc tạo tài khoản mới tại Mộc Yên.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../components/components.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- HEADER -->
  <div id="site-header"></div>

  <main class="auth-page">
    <div class="container auth-container">
      
      <!-- Cột trái: Ảnh minh họa (Ẩn trên mobile) -->
      <div class="auth-banner">
        <img src="../images/banner/story.jpg" alt="Mộc Yên Skincare">
        <div class="auth-banner-content">
          <h2>Chạm một nhịp,<br>nhận thêm nhiều dịu lành.</h2>
          <p>Đăng nhập để theo dõi đơn hàng và nhận những ưu đãi đặc quyền từ Mộc Yên.</p>
        </div>
      </div>

      <!-- Cột phải: Form Đăng nhập / Đăng ký -->
      <div class="auth-form-wrapper">
        
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-target="login-form">Đăng nhập</button>
          <button class="auth-tab" data-target="register-form">Đăng ký</button>
        </div>

        <!-- Form Đăng nhập -->
        <form id="login-form" class="auth-form active">
          <h2 class="auth-title">Chào mừng trở lại</h2>
          <p class="auth-subtitle">Vui lòng nhập thông tin để tiếp tục.</p>

          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Nhập email của bạn" required>
          </div>

          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <div class="password-input-wrap">
              <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
              <i class="fa-regular fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox"> Ghi nhớ đăng nhập
            </label>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-auth">Đăng nhập</button>
        </form>

        <!-- Form Đăng ký -->
        <form id="register-form" class="auth-form">
          <h2 class="auth-title">Tạo tài khoản mới</h2>
          <p class="auth-subtitle">Trở thành thành viên của Mộc Yên.</p>

          <div class="form-group">
            <label for="reg-name">Họ và tên</label>
            <input type="text" id="reg-name" placeholder="Nhập họ tên của bạn" required>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="Nhập email của bạn" required>
          </div>

          <div class="form-group">
            <label for="reg-password">Mật khẩu</label>
            <div class="password-input-wrap">
              <input type="password" id="reg-password" placeholder="Tạo mật khẩu" minlength="6" required>
              <i class="fa-regular fa-eye toggle-password"></i>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-auth">Đăng ký tài khoản</button>
        </form>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <!-- JS -->
  <script src="../components/components.js"></script>
  <script src="login.js"></script>
</body>
</html>
