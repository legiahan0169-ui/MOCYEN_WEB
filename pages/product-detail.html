<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm | Mộc Yên</title>
  <meta name="description" content="Thông tin chi tiết sản phẩm Mộc Yên.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Link CSS chuẩn của trang sản phẩm -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../components/components.css">
  <link rel="stylesheet" href="product-detail.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="product-detail-page">
    <div class="container">
      
      <!-- Breadcrumb -->
      <div class="pd-breadcrumb">
        <a href="../index.html">Trang chủ</a>
        <span>/</span>
        <a href="shop.html">Sản phẩm</a>
        <span>/</span>
        <span id="pd-breadcrumb-name">Đang tải...</span>
      </div>

      <!-- KHU VỰC CHÍNH (ẢNH & THÔNG TIN) -->
      <div class="pd-main-layout">
        
        <!-- Cột trái: Ảnh -->
        <div class="pd-gallery">
          <div class="pd-main-image">
            <img id="pd-img-main" src="" alt="Đang tải ảnh...">
          </div>
          <div class="pd-thumbnails" id="pd-thumbnails"></div>
        </div>

        <!-- Cột phải: Thông tin -->
        <div class="pd-info">
          <p class="pd-category" id="pd-category">DANH MỤC</p>
          <h1 class="pd-title" id="pd-name">Tên sản phẩm</h1>
          
          <div class="pd-meta">
            <div class="pd-rating">
              <i class="fa-solid fa-star"></i>
              <span id="pd-rating">0.0</span>
              <span class="pd-reviews" id="pd-reviews">(0 đánh giá)</span>
            </div>
            <div class="pd-sku">SKU: <span id="pd-sku">---</span></div>
          </div>

          <div class="pd-price-box">
            <strong class="pd-price" id="pd-price">0đ</strong>
          </div>

          <p class="pd-short-desc" id="pd-short-desc">Mô tả ngắn đang tải...</p>

          <div class="pd-attributes" id="pd-attributes"></div>

          <!-- Hành động mua -->
          <div class="pd-actions">
            <div class="pd-qty">
              <button type="button" class="pd-qty-btn" id="pd-qty-minus">−</button>
              <input type="number" id="pd-qty-input" value="1" min="1" max="99">
              <button type="button" class="pd-qty-btn" id="pd-qty-plus">+</button>
            </div>
            <button class="btn btn-primary pd-btn-add" id="pd-add-to-cart">
              <i class="fa-solid fa-bag-shopping"></i> Thêm vào giỏ
            </button>
          </div>

          <div class="pd-promises">
            <p><i class="fa-solid fa-leaf"></i> Thành phần chọn lọc, an toàn cho da</p>
            <p><i class="fa-solid fa-truck-fast"></i> Miễn phí giao hàng từ 499.000đ</p>
          </div>
        </div>
      </div>

      <!-- TABS THÔNG TIN -->
      <div class="pd-tabs-section">
        <div class="pd-tabs-header">
          <button class="pd-tab-btn active" data-tab="desc">Mô tả</button>
          <button class="pd-tab-btn" data-tab="ingredients">Thành phần</button>
          <button class="pd-tab-btn" data-tab="benefits">Công dụng</button>
          <button class="pd-tab-btn" data-tab="usage">Hướng dẫn sử dụng</button>
        </div>

        <div class="pd-tabs-content">
          <div class="pd-tab-panel active" id="tab-desc">
            <div id="pd-desc-content">Đang tải...</div>
          </div>
          <div class="pd-tab-panel" id="tab-ingredients">
            <div id="pd-ingredients-content">Đang tải...</div>
          </div>
          <div class="pd-tab-panel" id="tab-benefits">
            <div id="pd-benefits-content">Đang tải...</div>
          </div>
          <div class="pd-tab-panel" id="tab-usage">
            <div id="pd-usage-content">Đang tải...</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../components/components.js"></script>
  <script src="product-detail.js"></script>
</body>
</html>
